[project]
name = "warden-sdk"
version = "0.0.0"
description = "Warden backend SDK: token verification and authorization decisions for Python services."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "The Warden authors" }]
keywords = ["authorization", "rbac", "abac", "oidc", "identity"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]

# SPEC §12.2: no required dependency beyond these three.
dependencies = [
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
embedded = ["cel-python>=0.1"]     # only needed for cache_mode="embedded"
fastapi = ["fastapi>=0.110"]
django = ["django>=4.2"]
flask = ["flask>=3.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.9",
    "ruff>=0.4",
]

[project.scripts]
warden-doctor = "warden.doctor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warden"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
