# Warden server configuration.
#
# Every setting here can also be given as an environment variable or a flag; later
# layers win, in the order file → environment → flags. Run `warden help` for the full
# list of flags and their environment variables, and `warden config` to resolve and
# print the effective configuration before a deploy.
#
# Note this file is NOT warden.yaml — that name belongs to an application manifest
# (SPEC §11.2, examples/warden.yaml), which is a different schema entirely.
#
# Unknown keys are a startup error, not a warning: a typo must never leave a setting
# silently at its default.

# dev | staging | prod. Defaults to prod, so an operator who says nothing gets the
# strict behaviour: https issuer required, no in-process cache, no auto-migration.
environment: prod

# Which tiers this process serves: auth, pdp, mgmt, worker, or all (SPEC §5.2).
roles: [all]

# This deployment's public origin, and the "iss" claim of every token it signs.
# Required — relying parties compare it byte for byte.
issuer: https://warden.example.com

http:
  addr: ":8080"
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 120s
  shutdown_timeout: 30s
  max_request_bytes: 4194304
  # CIDRs whose X-Forwarded-For header is believed. Empty means trust nobody.
  # context.ip feeds authorization conditions (SPEC §9.6), so a spoofable client
  # address is a policy bypass rather than a logging nuisance — list only the
  # proxies actually in front of this deployment.
  trusted_proxy_cidrs: []

database:
  # The role that serves requests. Prefer WARDEN_DATABASE_URL over writing a password
  # into this file.
  #
  # This role must NOT be able to bypass row-level security — Warden checks at startup
  # and refuses to serve production traffic if it can, because a request-serving role
  # with BYPASSRLS has tenant isolation switched off with no visible symptom. Create
  # the roles with deploy/roles.sql.
  url: postgres://warden_app@localhost:5432/warden?sslmode=verify-full

  # Optional. The role for work that is inherently cross-tenant: migrations,
  # `warden init`, and background jobs such as assignment expiry. It holds BYPASSRLS,
  # and everything it does is audited precisely because the database is not
  # constraining it (SPEC §6.2). Without it, those operations are unavailable and
  # Warden says so rather than running them blind.
  system_url: postgres://warden_system@localhost:5432/warden?sslmode=verify-full
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 30m
  connect_timeout: 10s
  statement_timeout: 5s
  # There is no auto-migrate setting, on purpose. Migrations run as a separate
  # pre-upgrade job (SPEC §20.1), so a rolling deploy cannot have several replicas
  # racing to apply them: `migrate -path internal/store/migrations -database "$URL" up`,
  # which is what `make migrate-up`, the compose file and CI all run, at one pinned
  # version. See deploy/README.md.

cache:
  # redis is required for any deployment with more than one process: the change
  # stream that invalidates SDK caches fans out through it (SPEC §10.5).
  # in-process is a single-node convenience and is refused in production.
  backend: redis
  url: redis://localhost:6379/0
  dial_timeout: 5s
  pool_size: 20

security:
  # Where to read the key-encryption key: env:NAME, file:/path or kms:<uri>.
  # 32 bytes, base64 or hex. Generate one with: openssl rand -base64 32
  # There is no default and no generated fallback — a key invented at startup would
  # silently orphan every previously encrypted row on the next restart.
  kek: env:WARDEN_KEK
  # Keys retained for decryption during a rotation. Values written under them stay
  # readable; new values are written under `kek` above.
  retired_keks: []
  token_signing_algorithm: RS256
  # Bounded to 5m–15m by SPEC §8.2: a short lifetime is the backstop for revocation.
  access_token_ttl: 10m
  key_rotation_interval: 2160h # 90 days
  # How long a rotated-out key stays in JWKS. It must outlast every token that key
  # signed — so at least access_token_ttl — and, in practice, the caching relying
  # parties do of their own accord, which is why a day rather than a quarter hour.
  # Must be shorter than key_rotation_interval, or keys are never actually retired.
  key_overlap_window: 24h

  # A browser SSO session (SPEC §8.3). The absolute lifetime is the ceiling however
  # active the session is; the idle timeout slides, extended by every use, and must not
  # exceed the absolute one or it would never be what ends a session.
  session_absolute_lifetime: 720h # 30 days
  session_idle_timeout: 168h      # 7 days

  # A Have I Been Pwned corpus for the breached-password check that SPEC §7.2 makes
  # mandatory: the "hash:count" download, sorted by hash. It is searched in place, so
  # the full multi-gigabyte file is fine — it is never loaded into memory.
  #
  # Optional, and checked at startup: a path that does not open, or a file that is not
  # in that format, stops the process. Without it the check falls back to a small
  # built-in list, which is better than nothing and much worse than this.
  #   curl -L https://api.pwnedpasswords.com/range/... # see the HIBP downloader
  breached_password_file: ""

log:
  level: info   # debug | info | warn | error
  format: json  # json | text

telemetry:
  metrics_addr: ":9090"
  tracing_otlp_endpoint: ""
  trace_sample_ratio: 0.01
